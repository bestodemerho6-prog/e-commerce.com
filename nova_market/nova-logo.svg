<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 150" role="img" aria-labelledby="title desc">
  <title id="title">NOVA Market logo</title><desc id="desc">A geometric N monogram in a lime rounded square followed by NOVA Market wordmark.</desc>
  <defs><linearGradient id="lime" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#a8c44a"/><stop offset="1" stop-color="#e7f4a3"/></linearGradient></defs>
  <rect x="8" y="8" width="134" height="134" rx="34" fill="url(#lime)"/>
  <path d="M43 108V42l64 66V42" fill="none" stroke="#171a20" stroke-width="10" stroke-linecap="square" stroke-linejoin="miter"/>
  <text x="174" y="92" fill="#171a20" font-family="Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="5">NOVA</text>
  <text x="390" y="92" fill="#858991" font-family="Arial,sans-serif" font-size="26" font-weight="400" letter-spacing="1">MARKET</text>
